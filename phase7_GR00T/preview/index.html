<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>LIBERO suites</title>
  <style>
    body { margin: 0; background: #111; color: #eee; font: 16px/1.4 sans-serif; }
    h1 { font-size: 18px; font-weight: 600; margin: 20px 24px 8px; }
    p { margin: 0 24px 20px; color: #aaa; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 0 24px 32px; }
    figure { margin: 0; background: #1b1b1b; border-radius: 10px; padding: 12px; }
    figcaption { margin-bottom: 8px; }
    video { width: 100%; background: #000; border-radius: 6px; image-rendering: auto; }
    b { color: #fff; }
  </style>
</head>
<body>
  <h1>LIBERO 스위트 4개, 정면 카메라 시연 전체</h1>
  <p>10 Hz. 길이는 그 태스크를 끝낸 시간 그대로입니다.</p>
  <div class="grid">
    <figure>
      <figcaption><b>libero_10</b> · 21.4초 · 머그 세 개, 접시 두 개</figcaption>
      <video src="libero_10_front.mp4?v=2" controls autoplay loop muted playsinline></video>
    </figure>
    <figure>
      <figcaption><b>libero_goal</b> · 11.2초 · 스토브, 접시, 그릇, 서랍</figcaption>
      <video src="libero_goal_front.mp4?v=2" controls loop muted playsinline></video>
    </figure>
    <figure>
      <figcaption><b>libero_object</b> · 14.3초 · 바구니와 소스 병</figcaption>
      <video src="libero_object_front.mp4?v=2" controls loop muted playsinline></video>
    </figure>
    <figure>
      <figcaption><b>libero_spatial</b> · 11.0초 · 검은 그릇, 쿠키 상자, 라메킨</figcaption>
      <video src="libero_spatial_front.mp4?v=2" controls loop muted playsinline></video>
    </figure>
  </div>
</body>
</html>
